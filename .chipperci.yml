version: 1

environment:
  php: 8.4
  node: 22

services:
  - mysql: 8
  - dusk:

pipeline:
  - name: Setup
    cmd: |
      cp -v .env.example .env
      
      # Turning this off by default to be safe
      # Might need to run this again if local/Herd composer has self-updated
      sudo composer self-update --2
      
      composer install --no-interaction --prefer-dist --optimize-autoloader
      
      php artisan key:generate
      php artisan ziggy:generate

  - name: Assets
    cmd: |
      npm ci 
      npm run build

  - name: PHP Unit Tests
    cmd: |
      php artisan test --parallel --processes=4

  - name: JS Unit Tests
    cmd: |
      npm test

  - name: Argos Visual Regression
    cmd: |
      set -e

      if [ -z "$ARGOS_TOKEN" ]; then
        echo "ARGOS_TOKEN must be configured as a protected ChipperCI secret."
        exit 1
      fi

      if [ -z "$CI_COMMIT_SHA" ] || [ "${#CI_COMMIT_SHA}" -ne 40 ] || [ -z "$CI_COMMIT_BRANCH" ]; then
        echo "ChipperCI must provide a full commit SHA and branch for Argos."
        exit 1
      fi

      export ARGOS_COMMIT="$CI_COMMIT_SHA"
      export ARGOS_BRANCH="$CI_COMMIT_BRANCH"

      composer visual:install
      npm run visual:audit
      composer visual:test
      npm exec -- argos upload tests/Browser/Screenshots/ArgosCaptures
